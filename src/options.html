<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>iToken · 同步设置</title>
        <link rel="stylesheet" href="ui.css" />
    </head>
    <body>
        <main class="settings">
            <header class="brand">
                <img src="icons/logo.png" alt="" width="44" height="44" />
                <div>
                    <h1>iToken</h1>
                    <p>开发环境令牌同步</p>
                </div>
            </header>

            <section class="panel" aria-labelledby="import-title">
                <div class="import-header">
                    <h2 id="import-title">导入配置</h2>
                    <label class="team-toggle">
                        <input type="checkbox" id="useTeamPreset" checked />
                        团队预设
                    </label>
                </div>
                <p class="section-hint" id="import-hint">从 JSON 地址读取配置，检查后点击下方的「保存配置」。</p>
                <div id="teamPresetRow" class="import-row">
                    <select id="teamPreset" aria-label="团队预设方案" aria-describedby="import-hint" disabled>
                        <option value="">正在加载团队预设…</option>
                    </select>
                    <button type="button" id="applyPreset" class="button button-soft" disabled>加载方案</button>
                </div>
                <div id="remoteImportRow" class="import-row" hidden>
                    <input type="text" id="rssUrl" aria-labelledby="import-title" aria-describedby="import-hint"
                        placeholder="https://example.com/config.json" spellcheck="false" />
                    <button type="button" id="rssBtn" class="button button-soft">获取配置</button>
                </div>
            </section>

            <section class="panel" aria-labelledby="sync-title">
                <h2 id="sync-title">同步设置</h2>
                <p class="section-hint">指定登录来源、目标地址，以及需要同步的键名。</p>

                <div class="fields">
                    <div class="field">
                        <label for="fromHost">来源站点</label>
                        <input type="text" id="fromHost" placeholder="https://example.com" spellcheck="false" />
                    </div>

                    <div class="field">
                        <label for="toHost">目标地址</label>
                        <input type="text" id="toHost" placeholder="http://localhost:51200"
                            aria-describedby="target-hint" spellcheck="false" />
                        <p id="target-hint" class="hint">多个地址用逗号分隔。</p>
                    </div>

                    <div class="field">
                        <label for="localStorageKeys">LocalStorage 键</label>
                        <input type="text" id="localStorageKeys" placeholder="token,created_at"
                            aria-describedby="keys-hint" spellcheck="false" />
                    </div>

                    <div class="field">
                        <label for="cookieKeys">Cookie 键</label>
                        <input type="text" id="cookieKeys" placeholder="token,season_token"
                            aria-describedby="keys-hint" spellcheck="false" />
                        <p id="keys-hint" class="hint">多个键名用逗号分隔。</p>
                    </div>
                </div>

                <div hidden>
                    <label for="corsHost">CORS</label>
                    <textarea id="corsHost" rows="8"></textarea>
                </div>

                <footer class="panel-footer">
                    <details id="configMenu" class="config-menu">
                        <summary class="button button-soft">配置文件 <span aria-hidden="true">▾</span></summary>
                        <div class="config-menu-items">
                            <button type="button" id="importFile">导入配置</button>
                            <button type="button" id="exportFile">导出配置</button>
                        </div>
                    </details>
                    <input type="file" id="configFile" accept=".json,application/json" hidden />
                    <p id="status" role="status"></p>
                    <button type="button" id="saveBtn" class="button button-primary">保存配置</button>
                </footer>
            </section>
        </main>
        <script src="options.js"></script>
    </body>
</html>
